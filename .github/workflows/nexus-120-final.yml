name: NEXUS 1.2.0 Final Package

on:
  push:
    branches:
      - main
      - work/nexus-complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact pushed source revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run build and complete test suite
        run: npm test

      - name: Build production output
        run: npm run build

      - name: Create final package and split for safe transfer
        run: |
          mkdir -p release
          zip -qr -9 release/NEXUS-1.2.0-FINAL.zip \
            src dist test assets/rpg data package.json package-lock.json tsconfig.json \
            Dockerfile .dockerignore .env.example README.md INSTALL.md UPGRADE-SAFETY.md \
            COMMANDS.md RPG-REHBER.md CHANGELOG.md
          sha256sum release/NEXUS-1.2.0-FINAL.zip > release/SHA256SUMS.txt
          split -b 400m release/NEXUS-1.2.0-FINAL.zip release/NEXUS-PART-

      - name: Upload package part 1
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-PACKAGE-PART-1
          path: release/NEXUS-PART-aa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload package part 2
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-PACKAGE-PART-2
          path: release/NEXUS-PART-ab
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload package checksum
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-PACKAGE-CHECKSUM
          path: release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
